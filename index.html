<!DOCTYPE html>

<head>

  <title>Circa 71</title>

      height: 100%;
      background: #ffffff;

    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;

    .copy {

      line-height: 1.6;
      letter-spacing: 0.02em;
    }

    .copy p {
      margin: 0.6rem 0;
    }

    footer {
      margin-top: 3rem;
      font-size: 0.75rem;
      color: #777777;
      letter-spacing: 0.08em;
    }

</head>

<body>
  <div class="container">
    <div class="copy">
      <p><strong>Stories from close enough to feel.</strong></p>
      <p>Made with restraint.</p>
      <p>Crafted in proximity.</p>
    </div>

    <footer>

  </div>

</html>
